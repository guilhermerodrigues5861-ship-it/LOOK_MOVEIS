<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Look Design — Móveis com fábrica própria em Carmo do Cajuru, MG</title>
<meta name="description" content="Look Design Móveis: sofás, dormitórios, mesas de jantar, racks e cadeiras com fábrica própria em Carmo do Cajuru, MG. Desde 2009. Peça seu orçamento pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
document.documentElement.classList.add('js');
setTimeout(function(){var l=document.getElementById('loader');if(l)l.remove();},4500);
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F6F4EE;--bg2:#FFFFFF;--bg3:#ECE9E1;
  --ink:#1B1D18;--ink2:#5D6258;--ink3:#8B8F86;
  --line:rgba(27,29,24,.1);
  --verde:#8DC63F;--verde-d:#4E7A1A;--verde-l:#EEF6E2;
  --dark:#141612;
  --r:20px;
  --ff-d:'Fraunces',Georgia,serif;
  --ff:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
html{scroll-behavior:smooth}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
main,footer{overflow-x:clip}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit}
section{scroll-margin-top:70px}
::selection{background:var(--verde);color:var(--ink)}
:focus-visible{outline:2px solid var(--verde-d);outline-offset:3px;border-radius:6px}
.container{width:min(1240px,calc(100% - 48px));margin-inline:auto}

/* icons */
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.f{fill:currentColor;stroke:none}

/* type */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--verde-d)}
.eyebrow::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 4px rgba(141,198,63,.22)}
.h2{font-family:var(--ff-d);font-weight:400;font-size:clamp(36px,4.6vw,64px);line-height:1.04;letter-spacing:-.025em;margin:16px 0 18px}
.h2 em{font-style:italic;color:var(--verde-d)}
.lead{font-size:17px;color:var(--ink2);max-width:560px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:56px;flex-wrap:wrap}
.sec-head .h2{margin-bottom:0}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
